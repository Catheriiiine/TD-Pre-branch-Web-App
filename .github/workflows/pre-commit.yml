name: Pre-commit quality gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pre-commit
        run: python -m pip install 'pre-commit>=4.0,<5'

      # All hooks, including the auto-fixers, run on a disposable Git worktree.
      # Thus PR source files are never rewritten by CI. Any attempted fix fails
      # pre-commit and contributors must apply/re-stage changes locally.
      - name: Run all checks on a disposable worktree
        env:
          TMP_WORKTREE: ${{ runner.temp }}/quality-worktree
        run: |
          git worktree add --detach "$TMP_WORKTREE" HEAD
          cd "$TMP_WORKTREE"
          npm ci --prefix frontend
          pre-commit run --all-files

      - name: Validate every PR commit message
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MESSAGE_PATH: ${{ runner.temp }}/conventional-commit-message.txt
        run: |
          git rev-list --reverse "$BASE_SHA..$HEAD_SHA" | while read -r sha; do
            echo "Checking commit $sha"
            git log -1 --format=%B "$sha" > "$MESSAGE_PATH"
            pre-commit run conventional-pre-commit \
              --hook-type commit-msg --commit-msg-filename "$MESSAGE_PATH"
          done
